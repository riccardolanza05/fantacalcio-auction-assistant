# Riferimento dei percorsi e dei parametri usati nella pipeline e nel
# server. Non e' letto automaticamente da nessuno script (per restare
# minimali, gli script prendono questi valori da riga di comando o da
# variabili d'ambiente); questo file serve da promemoria di come incastrare
# i pezzi. Vedi docs/data-sources.md per dove procurarsi ciascun file.

[lega]
nome = "Lega Abendosa"          # solo etichetta, non usato dal codice
squadre = 10                     # NSQ in server/build_giocatori.py e server/vorp_live.py
budget_per_squadra = 1000
mia_squadra = "NapoLanza"        # -> variabile d'ambiente MIA_SQUADRA

[pricing.votes]
# python pricing/votes/scraper_voti.py  (poi parse_voti.py, valida_voti.py, aggrega_voti_v3.py)
voti_aggregato_csv = "voti_aggregato_v3.csv"    # dato personale scaricato col TUO account, non nel repo

[pricing.model]
# python pricing/model/build_hreg.py --voti-aggregato <voti_aggregato_v3.csv> --out <Hreg.pkl>
# python pricing/model/train_model.py --voti-aggregato ... --quotazioni-corrente ... --quotazioni-storiche-glob ... --out <predizioni>
predizioni_csv = "predizioni_2026_27_v2.csv"   # generato da pricing/model/train_model.py
hreg_pkl = "Hreg.pkl"                           # generato da pricing/model/build_hreg.py, opzionale (strato 3b)

[pricing]
# python pricing/modello_prezzo.py --in-csv <predizioni> --out-csv <prezzi> [--hreg <Hreg.pkl>]
prezzi_csv = "prezzi_2026_27.csv"

# python pricing/verdetto.py --in-csv <prezzi> --out-csv <verdetto>
verdetto_csv = "verdetto_2026_27.csv"

[server]
# python server/build_giocatori.py --prezzi-csv ... --verdetto-csv ... --predizioni ... --statistiche ... --probabili ... --out ...
statistiche_xlsx = "Statistiche_Fantacalcio_Stagione_2025_26.xlsx"   # file ufficiale fantacalcio.it
probabili_html = "probabili-formazioni-serie-a"                      # pagina salvata come HTML
giocatori_xlsx = "giocatori_2026_27.xlsx"                            # database d'uscita, usato da app.py

# python server/build_storico_arricchito.py --rose <Rose_lega-tuasigla.xlsx> --quotazioni ... --statistiche ... --out ...
rose_lega_xlsx = "Rose_lega-<tuasigla>.xlsx"    # export privato della tua lega, non nel repo
quotazioni_xlsx = "Quotazioni_Fantacalcio_Stagione_2025_26.xlsx"
storico_asta_xlsx = "storico_asta_2025_26.xlsx"

[avvio]
# ASTA_PASSWORD e' obbligatoria: il server non parte senza (server/auth.py)
asta_password = "IMPOSTALA_TU"
